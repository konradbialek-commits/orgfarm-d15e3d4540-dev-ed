<template>
    <div class="sleek-carousel-wrapper">
        
        <template for:each={slides} for:item="slide">
            <div key={slide.id} class={slide.cssClass}>
                <img src={slide.image} alt={slide.header} class="slide-image" />
                
                <div class="text-overlay">
                    <h2 class="slide-header">{slide.header}</h2>
                    <p class="slide-desc">{slide.description}</p>
                </div>
            </div>
        </template>
        
        <div class="nav-button prev-button" onclick={handlePrevClick}>
            <lightning-icon icon-name="utility:chevronleft" variant="inverse" size="large"></lightning-icon>
        </div>
        <div class="nav-button next-button" onclick={handleNextClick}>
            <lightning-icon icon-name="utility:chevronright" variant="inverse" size="large"></lightning-icon>
        </div>

        <div class="dots-container">
            <template for:each={dots} for:item="dot">
                <div key={dot.index} data-index={dot.index} class={dot.cssClass} onclick={handleDotClick}></div>
            </template>
        </div>

    </div>
</template>
