<template>
    <lightning-quick-action-panel title={labels.title}>
        <template if:true={isWaiting}>
            <div class="slds-is-relative slds-p-vertical_xx-large">
                <lightning-spinner alternative-text={labels.processing} size="medium" variant="brand"></lightning-spinner>
                <div class="slds-text-align_center slds-m-top_xx-large slds-text-heading_small slds-text-color_weak slds-p-top_large">
                    {labels.submitting}
                </div>
            </div>
        </template>

        <template if:false={isWaiting}>
            <div class="slds-scrollable_y slds-m-bottom_medium" style="max-height: 300px">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th style="width: 3.25rem"></th>
                            <th>{labels.product}</th>
                            <th style="width: 150px">{labels.refundType}</th>
                            <th style="width: 150px">{labels.refundAmount}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={orderItems} for:item="item">
                            <tr key={item.Id}>
                                <td>
                                    <lightning-input
                                        type="checkbox"
                                        data-id={item.Id}
                                        checked={item.selected}
                                        onchange={handleRowSelection}
                                    ></lightning-input>
                                </td>
                                <td>
                                    <div class="slds-truncate">{item.ProductName}</div>
                                    <div class="slds-text-color_weak slds-text-body_small">
                                        Qty: {item.Quantity} |
                                        <lightning-formatted-number
                                            value={item.UnitPrice}
                                            format-style="currency"
                                        ></lightning-formatted-number>
                                    </div>
                                </td>
                                <td>
                                    <lightning-combobox
                                        data-id={item.Id}
                                        value={item.refundType}
                                        options={refundOptions}
                                        onchange={handleTypeChange}
                                        disabled={item.disabled}
                                        variant="label-hidden"
                                    ></lightning-combobox>
                                </td>
                                <td>
                                    <lightning-input
                                        type="number"
                                        data-id={item.Id}
                                        value={item.refundAmount}
                                        onchange={handleAmountChange}
                                        disabled={item.disabled}
                                        variant="label-hidden"
                                        step="0.01"
                                    ></lightning-input>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <div class="slds-m-bottom_medium">
                <lightning-textarea
                    name="description"
                    label={labels.reason}
                    value={description}
                    onchange={handleReasonChange}
                    required
                ></lightning-textarea>
            </div>
        </template>

        <div slot="footer">
            <lightning-button label={labels.cancel} onclick={handleCancel} class="slds-m-right_small"></lightning-button>
            <lightning-button variant="brand" label={labels.submit} onclick={handleSubmit} disabled={isSubmitDisabled}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
