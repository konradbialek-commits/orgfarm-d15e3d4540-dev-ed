<template>
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium slds-hyphenate">Generate Order & Contract</h2>
                </header>
                
                <div class="slds-modal__content slds-p-around_medium slds-is-relative" style="min-height: 250px;">
                    
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                    </template>

                    <lightning-flow 
                        flow-api-name={flowApiName} 
                        flow-input-variables={flowInputVariables}
                        onstatuschange={handleFlowStatusChange}>
                    </lightning-flow>
                </div>

            </div>
        </section>
        
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
