<template>
    <lightning-quick-action-panel title={labels.title}>
        
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
        </template>

        <template if:false={isSummaryPage}>
            <div class="slds-grid slds-wrap slds-gutters slds-p-bottom_medium">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small">
                    <lightning-combobox
                        name="pricebook"
                        label="Price Book"
                        value={selectedPricebookId}
                        options={pricebookOptions}
                        onchange={handlePricebookChange}
                        required>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small">
                    <lightning-combobox
                        name="family"
                        label="Product Family"
                        value={selectedFamily}
                        options={familyOptions}
                        onchange={handleFamilyChange}
                        disabled={isSearchDisabled}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small">
                    <lightning-input 
                        type="search" 
                        label={labels.search} 
                        placeholder="Type..." 
                        onchange={handleSearch}
                        disabled={isSearchDisabled}>
                    </lightning-input>
                </div>
            </div>
            
            <div class="slds-m-bottom_medium" style="max-height: 400px; overflow-y: auto;">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col" style="width: 3.25rem;"></th>
                            <th scope="col"><div class="slds-truncate">Product Name</div></th>
                            <th scope="col"><div class="slds-truncate">Family</div></th>
                            <th scope="col"><div class="slds-truncate">Unit Price</div></th>
                            <th scope="col" style="width: 120px;"><div class="slds-truncate">Quantity</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={products} for:item="prod">
                            <tr key={prod.Id}>
                                <td>
                                    <lightning-input type="checkbox" data-id={prod.Id} checked={prod.selected} onchange={handleRowSelection}></lightning-input>
                                </td>
                                <td><div class="slds-truncate">{prod.productName}</div></td>
                                <td><div class="slds-truncate">{prod.family}</div></td>
                                <td>
                                    <lightning-formatted-number value={prod.unitPrice} format-style="currency"></lightning-formatted-number>
                                </td>
                                <td>
                                    <lightning-input type="number" variant="label-hidden" data-id={prod.Id} value={prod.quantity} onchange={handleQuantityChange} min="1"></lightning-input>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            
            <div slot="footer">
                <lightning-button label={labels.next} variant="brand" onclick={goToSummary}></lightning-button>
            </div>
        </template>

        <template if:true={isSummaryPage}>
            <div class="slds-text-heading_small slds-m-bottom_medium slds-text-title_caps">{labels.review}</div>
            
            <div class="slds-m-bottom_medium" style="max-height: 250px; overflow-y: auto;">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th>Product Name</th>
                            <th>Quantity</th>
                            <th>Unit Price</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={summaryProducts} for:item="prod">
                            <tr key={prod.Id}>
                                <td>{prod.productName}</td>
                                <td>{prod.quantity}</td>
                                <td>
                                    <template if:true={prod.hasLineDiscount}>
                                        <span style="text-decoration: line-through;" class="slds-text-color_weak slds-m-right_x-small">
                                            <lightning-formatted-number value={prod.unitPrice} format-style="currency"></lightning-formatted-number>
                                        </span>
                                        <lightning-formatted-number value={prod.discountedUnitPrice} format-style="currency"></lightning-formatted-number>
                                    </template>
                                    <template if:false={prod.hasLineDiscount}>
                                        <lightning-formatted-number value={prod.unitPrice} format-style="currency"></lightning-formatted-number>
                                    </template>
                                </td>
                                <td>
                                    <strong><lightning-formatted-number value={prod.discountedTotal} format-style="currency"></lightning-formatted-number></strong>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <div class="slds-box slds-theme_shade slds-m-top_medium">
                <div class="slds-grid slds-wrap slds-grid_align-spread">
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
                        <span class="slds-text-color_weak">{labels.subtotal}:</span>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-text-align_right slds-p-bottom_x-small">
                        <lightning-formatted-number value={discountData.originalTotal} format-style="currency"></lightning-formatted-number>
                    </div>

                    <template if:true={hasDiscount}>
                        <div class="slds-col slds-size_1-of-2 slds-p-bottom_x-small">
                            <span class="slds-text-color_success">Discounts ({discountData.appliedDiscounts}):</span>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-text-align_right slds-text-color_success slds-p-bottom_x-small">
                            -<lightning-formatted-number value={discountData.discountAmount} format-style="currency"></lightning-formatted-number> 
                            (<lightning-formatted-number value={discountData.discountPercent} maximum-fraction-digits="2"></lightning-formatted-number>%)
                        </div>
                    </template>
                    
                    <div class="slds-col slds-size_1-of-1 slds-m-top_x-small slds-border_top slds-p-top_x-small">
                        <div class="slds-grid slds-grid_align-spread">
                            <div class="slds-col slds-text-heading_small"><strong>{labels.finalTotal}:</strong></div>
                            <div class="slds-col slds-text-heading_small">
                                <strong><lightning-formatted-number value={discountData.finalTotal} format-style="currency"></lightning-formatted-number></strong>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div slot="footer">
                <lightning-button label={labels.back} onclick={goBack} class="slds-m-right_small"></lightning-button>
                <lightning-button label={labels.submit} variant="brand" onclick={handleSubmit}></lightning-button>
            </div>
        </template>
    </lightning-quick-action-panel>
</template>
