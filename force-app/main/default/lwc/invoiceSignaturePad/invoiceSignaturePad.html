<template>
    <lightning-quick-action-panel title="Sign BookSmart Invoice">
        
        <template if:true={isLoading}>
            <div style="height: 150px; position:relative;">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:true={isSigned}>
                <div class="slds-p-around_large slds-text-align_center">
                    <lightning-icon icon-name="utility:success" variant="success" size="large" class="slds-m-bottom_medium"></lightning-icon>
                    <h2 class="slds-text-heading_medium slds-m-bottom_small slds-text-color_success">Already Signed</h2>
                    <p>This document has already been authorized and finalized. It cannot be signed again.</p>
                </div>
                <div slot="footer">
                    <lightning-button label="Close" onclick={handleCancel}></lightning-button>
                </div>
            </template>

            <template if:false={isSigned}>
                <div class="slds-p-around_medium">
                    <p class="slds-m-bottom_small">Please draw your signature in the box below to authorize the invoice.</p>
                    <div style="border: 2px solid #ccc; background-color: #f9f9f9; width: 100%; height: 250px;">
                        <canvas 
                            lwc:dom="manual" 
                            onmousedown={handleMouseDown} 
                            onmouseup={handleMouseUp} 
                            onmousemove={handleMouseMove}
                            ontouchstart={handleTouchStart}
                            ontouchend={handleTouchEnd}
                            ontouchmove={handleTouchMove}
                            style="width: 100%; height: 100%; touch-action: none;">
                        </canvas>
                    </div>
                </div>
                <div slot="footer">
                    <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
                    <lightning-button label="Clear Signature" onclick={handleClear} class="slds-m-right_small"></lightning-button>
                    <lightning-button variant="brand" label="Save & Generate Invoice" onclick={handleSave}></lightning-button>
                </div>
            </template>
        </template>

    </lightning-quick-action-panel>
</template>
