<template>
    <lightning-quick-action-panel title={labels.title}>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text={labels.processing} size="medium"></lightning-spinner>
        </template>

        <template if:false={isLoading}>
            <div class="slds-scrollable_y slds-m-bottom_medium" style="max-height: 300px">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th>{labels.product}</th>
                            <th>{labels.requested}</th>
                            <th style="width: 180px">{labels.decision}</th>
                            <th style="width: 140px">{labels.approvedAmount}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={lineItems} for:item="item">
                            <tr key={item.Id}>
                                <td>
                                    <div class="slds-truncate"><strong>{item.Product_Name__c}</strong></div>
                                    <template if:true={item.Is_External__c}>
                                        <lightning-badge label="External" class="slds-theme_warning"></lightning-badge>
                                    </template>
                                </td>
                                <td>
                                    <div>{item.Requested_Refund_Type__c}</div>
                                    <lightning-formatted-number
                                        value={item.Refund_Amount__c}
                                        format-style="currency"
                                    ></lightning-formatted-number>
                                </td>
                                <td>
                                    <lightning-combobox
                                        data-id={item.Id}
                                        value={item.Refund_Status__c}
                                        options={decisionOptions}
                                        onchange={handleDecisionChange}
                                        disabled={item.isReadOnly}
                                        variant="label-hidden"
                                    >
                                    </lightning-combobox>
                                </td>
                                <td>
                                    <lightning-input
                                        type="number"
                                        data-id={item.Id}
                                        value={item.approvedAmount}
                                        onchange={handleAmountChange}
                                        disabled={item.disableAmount}
                                        variant="label-hidden"
                                        step="0.01"
                                    >
                                    </lightning-input>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <div class="slds-m-bottom_medium slds-p-horizontal_small">
                <lightning-textarea
                    name="comments"
                    label={labels.comments}
                    value={comments}
                    onchange={handleCommentsChange}
                ></lightning-textarea>
            </div>

            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-p-horizontal_small slds-m-bottom_small">{errorMessage}</div>
            </template>
        </template>

        <div slot="footer" class="slds-grid slds-grid_align-spread">
            <div>
                <lightning-button label="Reject Request" variant="destructive" onclick={handleReject}></lightning-button>
            </div>
            <div>
                <lightning-button label={labels.cancel} onclick={handleCancel} class="slds-m-right_small"></lightning-button>
                <lightning-button
                    variant="brand"
                    label={labels.submit}
                    onclick={handleSubmit}
                    disabled={isSubmitDisabled}
                ></lightning-button>
            </div>
        </div>
    </lightning-quick-action-panel>
</template>
