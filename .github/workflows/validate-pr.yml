name: Validate PR on Salesforce

on:
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install sfdx-git-delta plugin
        run: echo y | sf plugins install sfdx-git-delta

      - name: Authenticate to Salesforce via JWT
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf org login jwt --client-id ${{ secrets.SF_CLIENT_ID }} --jwt-key-file server.key --username ${{ secrets.SF_USERNAME }} --alias ci-org --set-default
          rm server.key

      - name: Generate Delta package.xml
        run: |
          sf sgd source delta --to "HEAD" --from "origin/${{ github.base_ref }}" --output .

      - name: Validate Source
        run: |
          if grep -q '<types>' package/package.xml; then
            mkdir -p test-results
            sf project deploy start --manifest package/package.xml --target-org ci-org --dry-run --test-level RunLocalTests --results-dir test-results --wait 60
          else
            echo "No Salesforce metadata changes detected. Skipping deployment."
          fi

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: 'test-results/**/*.xml'