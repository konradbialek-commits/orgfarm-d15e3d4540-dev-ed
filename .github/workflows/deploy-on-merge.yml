name: Deploy to Salesforce

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install sfdx-git-delta plugin
        run: echo y | sf plugins install sfdx-git-delta

      - name: Authenticate to Salesforce via JWT
        run: |
          # 1. Dump the private key secret into a temporary file
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          
          # 2. Authenticate using the JWT flow
          sf org login jwt --client-id ${{ secrets.SF_CLIENT_ID }} --jwt-key-file server.key --username ${{ secrets.SF_USERNAME }} --alias ci-org --set-default
          
          # 3. Clean up the key file for security
          rm server.key

      - name: Generate Delta package.xml
        run: |
          sf sgd source delta --to "${{ github.sha }}" --from "${{ github.event.before }}" --output .

      - name: Deploy Source
        run: |
          if grep -q '<types>' package/package.xml; then
            sf project deploy start --manifest package/package.xml --target-org ci-org --test-level RunLocalTests
          else
            echo "No Salesforce metadata changes detected. Skipping deployment."
          fi